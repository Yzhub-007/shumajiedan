# 管理后台 CI（计划书 1.1.6）：依赖安装 + 构建
name: admin-web

on:
  push:
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web.yml"
  pull_request:
    paths:
      - "admin-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
