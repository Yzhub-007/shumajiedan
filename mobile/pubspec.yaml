name: repairhub_app
description: 机器报修接单平台 App（客户端 + 工程师端，同一 App 两种身份）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（计划书 4.1：Riverpod 或 Bloc，选 Riverpod）
  flutter_riverpod: ^2.5.1
  # 路由（计划书 1.2.2 脚手架选型）
  go_router: ^14.2.0
  # 网络层
  dio: ^5.4.3
  # 本地存储（token / 身份）
  shared_preferences: ^2.2.3
  # 定位（工程师端位置上报 / 客户端地图选点）
  geolocator: ^12.0.0
  # 拍照/相册（发单、完工照片）
  image_picker: ^1.1.1
  # 实时消息（STOMP over WebSocket）
  web_socket_channel: ^3.0.0
  stomp_dart_client: ^2.0.0
  # 拨号联系工程师（计划书 2.2.x）
  url_launcher: ^6.3.0
  # 时间格式化
  intl: ^0.19.0

  # TODO(1.3.2) 第三方 SDK（P1 阶段逐个验证）：
  #   amap_flutter_map / amap_flutter_location —— 高德地图与定位
  #   jpush_flutter —— 极光推送
  #   腾讯云 COS / 阿里云 OSS 直传插件

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# geolocator_android 4.6.2 的 gradle 脚本需要新版 Flutter 插件注册表，
# 与 Flutter 3.24 生成的 Android 工程不兼容（compileSdkVersion 未注入），锁定 4.6.1
dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
