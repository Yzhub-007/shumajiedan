spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/repairhub
    username: repairhub
    password: repairhub123
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # 表结构统一由 Flyway 管理，实体仅做校验
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.repairhub: debug
    org.hibernate.SQL: debug
